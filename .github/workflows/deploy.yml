name: Build, Test & Deploy Model

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  test-and-validate:
    name: Test Warehouse & Train Model
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Data Warehouse & Load Staging
        env:
          PGPASSWORD: postgres
        run: |
          echo "Initializing database schemas..."
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f sql/01_create_database_and_schemas.sql
          
          for script in 02_staging_load 03_star_schema_ddl 04_etl_procedure 05_validation_checks 06_olap_queries 07_materialized_views 08_mining_objects; do
            echo "Executing sql/${script}.sql..."
            psql -h localhost -p 5432 -U postgres -d telco_churn_dw -v ON_ERROR_STOP=1 -P pager=off -f "sql/${script}.sql"
          done

      - name: Run Machine Learning Mining Pipeline
        env:
          PGPASSWORD: postgres
        run: |
          python mining/churn_mining.py --host localhost --port 5432 --user postgres --dbname telco_churn_dw

      - name: Verify Model Artifacts Generated
        run: |
          test -f mining/outputs/01_model_comparison.png
          test -f mining/outputs/02_roc_curves.png
          test -f mining/outputs/test_metrics.csv
          test -f mining/outputs/results_summary.txt
          test -f mining/outputs/insights_report.md
          test -f mining/outputs/retention_solutions.csv
          grep -q "Recommended solution" mining/outputs/insights_report.md
          grep -q "Why customers leave" mining/outputs/insights_report.md
          test -f mining/outputs/churn_reasons.csv
          echo "All model outputs and evaluation charts successfully verified."

  deploy-container:
    name: Build & Deploy Container to GitHub Registry
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Summary
        run: |
          echo "### 🚀 Model & Warehouse Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry**: GitHub Container Registry (GHCR)" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`ghcr.io/${{ github.repository }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Developers**: MuhammaD_Wallah and the GROUP" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Pull & Run Anywhere:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  deploy-github-pages:
    name: Deploy Showcase to GitHub Pages
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

