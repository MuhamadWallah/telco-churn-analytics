# Streamlit settings for the Telco churn dashboard.
# Streamlit reads this file from the folder you start it in, so always start
# the dashboard from the project folder:   python -m streamlit run dashboard/app.py

[theme]
base = "light"
primaryColor = "#2a78d6"              # blue - the main accent (buttons, focus)
backgroundColor = "#fcfcfb"           # page surface
secondaryBackgroundColor = "#f3f2ee"  # sidebar and input fields
textColor = "#0b0b0b"
font = "sans serif"

[client]
toolbarMode = "minimal"               # hide developer menus from dashboard users

[browser]
gatherUsageStats = false              # do not send usage statistics to Streamlit

[server]
runOnSave = false
address = "localhost"                 # only this computer can open the dashboard;
                                      # change to "0.0.0.0" ONLY for a supervised demo on a trusted network
