# Streamlit settings for the Telco churn web app (app/) and dashboard (dashboard/).
# Streamlit reads this file from the folder you start it in, so always start
# from the project folder:   streamlit run app/streamlit_app.py
# Streamlit Community Cloud also reads it from the repository root.

[theme]
base = "light"
primaryColor = "#2a78d6"              # blue - the main accent (buttons, focus)
backgroundColor = "#fcfcfb"           # page surface
secondaryBackgroundColor = "#f3f2ee"  # sidebar and input fields
textColor = "#0b0b0b"
font = "sans serif"

[client]
toolbarMode = "minimal"               # hide developer menus from visitors

[browser]
gatherUsageStats = false              # do not send usage statistics to Streamlit

[server]
runOnSave = false
# No "address" setting here: Streamlit Community Cloud must be able to reach the
# app. To allow ONLY your own computer during local tests, start it with
#     streamlit run app/streamlit_app.py --server.address localhost
